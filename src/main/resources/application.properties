# Database Configuration
spring.datasource.url=\${DB_URL:jdbc:h2:mem:rqtech;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=\${DB_USERNAME:sa}
spring.datasource.password=\${DB_PASSWORD:}
spring.datasource.driver-class-name=\${DB_DRIVER:org.h2.Driver}

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=\${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Local storage path for uploaded repair photos
rqtech.upload.dir=uploads/repairs

# Mail Configuration (Example - update with real SMTP)
spring.mail.host=\${MAIL_HOST:smtp.example.com}
spring.mail.port=\${MAIL_PORT:587}
spring.mail.username=\${MAIL_USERNAME:user@example.com}
spring.mail.password=\${MAIL_PASSWORD:pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security
# No default credentials here. Use the DatabaseInitializer for the initial admin.
# Application will use JWT for stateless auth.
application.security.jwt.secret-key=\${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000
